name: z2u inspect sell form

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Link of the z2u sell form page for Clash of Clans accounts (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: z2u-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scan sell form
        env:
          Z2U_COOKIES: ${{ secrets.Z2U_COOKIES }}
          TARGET_URL: ${{ inputs.target_url }}
        run: python z2u_inspect.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect
          path: inspect/
          retention-days: 1
