name: z2u online

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: z2u-online
  cancel-in-progress: false

jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Stay online on z2u
        env:
          Z2U_COOKIES: ${{ secrets.Z2U_COOKIES }}
          RUN_MINUTES: "345"
        run: python z2u_online.py

      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run online.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"
